name: Release Linux (portátil)

on:
  push:
    tags:
      - 'v*-linux*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Electron (node_modules + binário)
        working-directory: resources/app
        run: |
          npm ci
          # O postinstall do electron é ignorado em alguns runners; baixa o binário explicitamente.
          node node_modules/electron/install.js
          test -x node_modules/electron/dist/electron || { echo "Binário do Electron não baixado" >&2; exit 1; }
          du -sh node_modules

      - name: Testes
        working-directory: resources/app
        run: npm test

      - name: Gerar pasta portátil
        run: tools/build-portable-linux.sh "$RUNNER_TEMP/Taiga-Launcher-Portable"

      - name: Compactar
        run: |
          du -sh "$RUNNER_TEMP/Taiga-Launcher-Portable/Taiga-Launcher/app/node_modules"
          tar -czf taiga-launcher-linux-portable.tar.gz -C "$RUNNER_TEMP" Taiga-Launcher-Portable
          test "$(stat -c%s taiga-launcher-linux-portable.tar.gz)" -gt 50000000 || { echo "Artefato suspeitosamente pequeno" >&2; exit 1; }

      - name: Publicar na Release da tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TITLE="Taiga Launcher $TAG - Linux"
          NOTES=$(cat <<'EOF'
Portable Linux build of Taiga Launcher. The app and its data stay inside the extracted folder, so you can move or copy it to another Linux PC or a USB drive.

Requirements: 64-bit Linux and Steam. To play Windows games, enable Proton for non-Steam games in Steam — Taiga never runs `.exe` files directly on Linux.

How to use:

1. Download `taiga-launcher-linux-portable.tar.gz` and extract it anywhere.
2. Run `./iniciar-taiga.sh` from the extracted folder. Nothing is installed system-wide.
3. Set the Steam folder on first launch (detected under `~/.local/share/Steam` or flatpak).

Included: Steam page and achievement injection over CDP, native/flatpak/AppImage emulator discovery, XDG paths and theme icons, store libraries through Legendary, `.desktop` shortcuts, playtime tracking and cross-platform VDF handling.

Automatic updates are disabled on Linux (upstream releases are Windows-only). Download a newer release to update. The full automated test suite runs in CI before each release is published.
EOF
)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" taiga-launcher-linux-portable.tar.gz --clobber
          else
            gh release create "$TAG" taiga-launcher-linux-portable.tar.gz --title "$TITLE" --notes "$NOTES"
          fi
          gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
